[package]
name = "flatrun"
version = "0.2.0"
edition = "2021"
authors = ["Ryan Brue <ryanbrue.dev@gmail.com>"]
readme = "README.md"
homepage = "https://linux-packaging-rs.github.io/flatrun"
repository = "https://github.com/linux-packaging-rs/flatrun"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rustix = { version = "1.1.3", features = ["process"] }
libflatpak = "0.7.0"
rand = "0.9.2"
signal-hook = "0.4.1"
log = "0.4.29"
clap = { version = "4.5.53", features = ["derive"] }
reqwest = { version = "0.12.28", features = ["blocking"] }
indicatif = "0.18.3"
indicatif-log-bridge = "0.2.3"
env_logger = "0.11.8"
